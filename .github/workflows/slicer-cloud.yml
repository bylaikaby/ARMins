# Version: 0.7.5 (local/unreleased)
# Last updated: 2026-10-23
# Change history: CHANGELOG.md
name: Fresh-machine Slicer

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run design first; review screenshots before hierarchy/behavior
        required: true
        default: design
        type: choice
        options: [design, hierarchy, behavior, visual]
      target:
        description: Windows 11 ARM64 runs x64 Slicer under Windows emulation
        required: true
        default: standard
        type: choice
        options: [standard, windows-11-arm]
      graphics:
        description: VM-only software OpenGL; Mesa is a separate compatibility test
        required: true
        default: bundled
        type: choice
        options: [bundled, mesa]


permissions:
  contents: read

jobs:
  slicer:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.target == 'windows-11-arm' && '["windows-11-arm"]' || '["ubuntu-22.04","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      ARMINS_TEST_PHASE: ${{ inputs.phase }}
      ARMINS_TEST_IMPORT: '1'
      PYTHONUTF8: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: ARMins fresh install
      - name: Linux runtime libraries and virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libglu1-mesa libpulse-mainloop-glib0 libnss3 libasound2 libsm6 libxt6 libxrender1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 qt5dxcb-plugin
      - name: Download and verify official Slicer 5.12.0
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'armins-cloud-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          "ARMINS_TEST_OUTPUT=$out" >> $env:GITHUB_ENV
          $install = Join-Path $env:RUNNER_TEMP 'Slicer'
          $curl = if ($IsWindows) { 'curl.exe' } else { 'curl' }
          if ($IsWindows) {
            $url = 'https://download.slicer.org/bitstream/6a3b7cf33e1fb85a5846ed22'
            $sha = '4fd7733c872dbe8bcf7fb2ff0f0f49414db10dcdff646fb30eb99a68c56455a086b745b0cc11bf9408a43f362762241bdc60de1fd6bac63ac67ad7180d4ffab1'
            $package = Join-Path $env:RUNNER_TEMP 'Slicer.exe'
          } else {
            $url = 'https://download.slicer.org/bitstream/6a3b212e3e1fb85a5846b058'
            $sha = 'dbdd960b2a90b250fd2fba2510696ff227f647682e3c20ad3b9f62b45454e8ae3fa00595bc796ccb61e60bf10b6607bfdf79d03df1df1c695ba3731a2705bd08'
            $package = Join-Path $env:RUNNER_TEMP 'Slicer.tar.gz'
          }
          & $curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output $package $url
          if ($LASTEXITCODE -ne 0) { throw 'Slicer download failed' }
          if ((Get-FileHash $package -Algorithm SHA512).Hash.ToLower() -ne $sha) { throw 'Slicer checksum mismatch' }
          if ($IsWindows) {
            $p = Start-Process $package -ArgumentList @('/S', "/D=$install") -Wait -PassThru -WindowStyle Hidden
            if ($p.ExitCode -ne 0) { throw "Slicer installer failed: $($p.ExitCode)" }
            $slicer = Join-Path $install 'Slicer.exe'
          } else {
            New-Item -ItemType Directory -Force $install | Out-Null
            tar -xzf $package -C $install --strip-components=1
            if ($LASTEXITCODE -ne 0) { throw 'Slicer extraction failed' }
            $slicer = Join-Path $install 'Slicer'
          }
          if (-not (Test-Path -LiteralPath $slicer)) { throw 'Slicer executable missing' }
          "ARMINS_SLICER=$slicer" >> $env:GITHUB_ENV
          $osIdentity = $null
          if ($IsWindows) {
            $osInfo = Get-CimInstance Win32_OperatingSystem
            $osIdentity = @{caption=$osInfo.Caption; version=$osInfo.Version; build=$osInfo.BuildNumber; product_type=$osInfo.ProductType; architecture=$osInfo.OSArchitecture; process_arch=[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString(); native_arch=[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()}
            if ('${{ inputs.target }}' -eq 'windows-11-arm' -and ($osInfo.Caption -notmatch 'Windows 11' -or $osInfo.ProductType -ne 1)) { throw 'The requested Windows 11 desktop VM was not provided' }
          }
          @{slicer_version='5.12.0'; os_identity=$osIdentity; requested_target='${{ inputs.target }}'; slicer_architecture='x64'; package_url=$url; sha512=$sha; runner_os=$env:RUNNER_OS; image_version=$env:ImageVersion; github_sha=$env:GITHUB_SHA; phase=$env:ARMINS_TEST_PHASE; slicer_pip_installs=@(); cache_used=$false; windows_graphics='bundled Qt software OpenGL for GPU-less VM'} | ConvertTo-Json | Set-Content (Join-Path $out 'cloud-runtime.json')
      - name: Optional modern Mesa for this disposable Slicer install only
        if: runner.os == 'Windows' && inputs.graphics == 'mesa'
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z'
          $sha = '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695'
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Mesa download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $sha) { throw 'Mesa checksum mismatch' }
          7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $gl = @(Get-ChildItem -LiteralPath $mesa -Recurse -Filter opengl32.dll | Where-Object { $_.Directory.Name -eq 'x64' })
          if ($gl.Count -ne 1) { throw 'Expected one x64 Mesa desktop OpenGL DLL' }
          $bin = Join-Path (Split-Path $env:ARMINS_SLICER) 'bin'
          $old = (Get-FileHash (Join-Path $bin 'opengl32sw.dll') -Algorithm SHA256).Hash.ToLower()
          $deployed = @{}
          foreach ($name in @('opengl32.dll','libgallium_wgl.dll','libglapi.dll','dxil.dll')) {
            $source = Join-Path $gl[0].Directory.FullName $name
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $bin $name) -Force
              $deployed[$name] = (Get-FileHash $source -Algorithm SHA256).Hash.ToLower()
            }
          }
          Copy-Item -LiteralPath $gl[0].FullName -Destination (Join-Path $bin 'opengl32sw.dll') -Force
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
          $runtimePath = Join-Path $env:ARMINS_TEST_OUTPUT 'cloud-runtime.json'
          $runtime = Get-Content $runtimePath -Raw | ConvertFrom-Json
          $runtime.windows_graphics = 'Mesa26.2.4 llvmpipe, app-local DLLs in disposable VM only; not stock bundled graphics'
          $runtime | ConvertTo-Json -Depth 10 | Set-Content $runtimePath
          @{version='26.2.4'; url=$url; sha256=$sha; original_bundled_sw_sha256=$old; deployed_dll_sha256=$deployed; scope='Disposable Slicer/bin only; no global driver, registry or user-PC changes'} | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:ARMINS_TEST_OUTPUT 'mesa-runtime.json')
      - name: Download public AFNI inputs for native load tests
        if: inputs.phase != 'design'
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'NMT_v2.1_sym.tgz'
          $atlasRoot = Join-Path $env:RUNNER_TEMP 'atlas-data'
          New-Item -ItemType Directory -Force $atlasRoot | Out-Null
          $curl = if ($IsWindows) { 'curl.exe' } else { 'curl' }
          & $curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 --output $archive https://afni.nimh.nih.gov/pub/dist/atlases/macaque/nmt/NMT_v2.1_sym.tgz
          if ($LASTEXITCODE -ne 0) { throw 'AFNI download failed' }
          tar -xzf $archive -C $atlasRoot
          if ($LASTEXITCODE -ne 0) { throw 'AFNI extraction failed' }
          $files = @(
            @('ARMINS_TEMPLATE', 'NMT_v2.1_sym_SS.nii.gz', '9e37a94c4b9e5865aabb9fd3b51dcc3b2cb16f3daed39c967e68acf16cf92bee'),
            @('ARMINS_ATLAS', 'ARM_6_in_NMT_v2.1_sym.nii.gz', '7df7e53df5aa1f142bf017aad89f1fde3c84a87a3e4f93adc7dbded69bc79338'),
            @('ARMINS_HIERARCHY', 'ARM_key_table.csv', 'f8214369170e2847ad1558295858222308c14ce98c8a91de88d1b40bebf5a39c')
          )
          foreach ($item in $files) {
            $matches = @(Get-ChildItem -LiteralPath $atlasRoot -File -Recurse -Filter $item[1])
            if ($matches.Count -ne 1) { throw "Expected one $($item[1]); found $($matches.Count)" }
            $path = $matches[0].FullName
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $item[2]) { throw "Input checksum mismatch: $($item[1])" }
            "$($item[0])=$path" >> $env:GITHUB_ENV
          }
      - name: Import and run actual Slicer GUI from an unrelated directory
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'ARMins fresh install/tests/slicer_smoke.py'
          $env:ARMINS_OUTPUT_DIR = Join-Path $env:ARMINS_TEST_OUTPUT 'outputs'
          if ($IsWindows) {
            $env:QT_OPENGL = 'software'
            $p = Start-Process $env:ARMINS_SLICER -ArgumentList @('--testing', '--no-splash', '--python-script', "`"$script`"") -RedirectStandardOutput (Join-Path $env:ARMINS_TEST_OUTPUT 'stdout.log') -RedirectStandardError (Join-Path $env:ARMINS_TEST_OUTPUT 'stderr.log') -Wait -PassThru -WindowStyle Hidden
            $code = $p.ExitCode
          } else {
            & xvfb-run -a -s '-screen 0 1920x1600x24' $env:ARMINS_SLICER --testing --no-splash --python-script $script 2>&1 | Tee-Object -FilePath (Join-Path $env:ARMINS_TEST_OUTPUT 'console.log')
            $code = $LASTEXITCODE
          }
          $receiptPath = Join-Path $env:ARMINS_TEST_OUTPUT "$($env:ARMINS_TEST_PHASE)_receipt.json"
          if (-not (Test-Path -LiteralPath $receiptPath)) { throw "No test receipt; launcher exit $code" }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($code -ne 0 -or $receipt.status -ne 'passed') { throw "Native test failed: $($receipt.error); launcher exit $code" }
          if ($env:ARMINS_TEST_PHASE -eq 'visual') {
            $graphicsErrors = @(Get-ChildItem -LiteralPath $env:ARMINS_TEST_OUTPUT -Filter '*.log' | Select-String -Pattern 'GLSL.*not supported|Failed to create context|Could not create shader|QOpenGLContext creation failed')
            if ($graphicsErrors.Count -gt 0) { throw "Slicer graphics errors in logs: $($graphicsErrors.Count); inspect artifacts" }
          }
          $receipt | ConvertTo-Json -Depth 30
      - name: Keep small logs, receipts and GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slicer-${{ matrix.os }}-${{ inputs.phase }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/armins-cloud-evidence/*.json
            ${{ runner.temp }}/armins-cloud-evidence/*.log
            ${{ runner.temp }}/armins-cloud-evidence/*.png
          if-no-files-found: warn
